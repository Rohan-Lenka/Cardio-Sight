[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools"]

[project]
authors = ["Rohan Lenka", "Shashwat Verma", "Apoorva Pradhan"]
description = "Implementation of remote Photoplethysmography in Python"
dynamic = ["version"]
dependencies = [
    "hydra-core",
    "mediapipe",
    "numpy",
    "opencv-contrib-python",
    "pandas",
    "scipy",
]
name = "CardioSight"
readme = "README.md"

[project.optional-dependencies]
qt6 = ["PyQt6", "pyqtgraph"]
dev = [
    "mkdocs-autorefs",
    "mkdocs-jupyter",
    "mkdocs-material",
    "mkdocs-section-index",
    "mkdocs",
    "mkdocstrings[python]",
    "pytest",
]

[project.urls]
repository = "https://github.com/Rohan-Lenka/Cardio-Sight"

[project.scripts]
run-yarppg = "yarppg.main:run_yarppg"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "yarppg.__version__" }
